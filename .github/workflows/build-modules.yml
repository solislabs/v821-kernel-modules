name: Build V821 Kernel Modules and DAP Player

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make bc bison flex libssl-dev libelf-dev xz-utils wget gcc python3 git

      - name: Download AvaotaSBC Official V821 Toolchain
        run: |
          echo "Downloading official toolchain..."
          wget -q https://github.com/AvaotaSBC/toolchains/releases/download/v821-toolchains/nds32le-linux-musl-v5d.tar.xz
          sudo mkdir -p /opt/v821-toolchain
          sudo tar -xf nds32le-linux-musl-v5d.tar.xz -C /opt/v821-toolchain --strip-components=1
          ls -la /opt/v821-toolchain/bin/

      - name: Clone AvaotaSBC V821 Linux Kernel
        run: |
          git clone --depth 1 --branch v821-avaota-f1 https://github.com/AvaotaSBC/linux-v8xx.git kernel

      - name: Build Kernel Modules
        run: |
          TC_PREFIX=$(ls /opt/v821-toolchain/bin/*-gcc | head -n1 | sed 's/gcc$//')
          echo "Using toolchain prefix: $TC_PREFIX"
          cd kernel
          export BSP_TOP="bsp/"
          ln -sf bsp/platform platform
          ln -sf bsp/drivers drivers_bsp
          ln -sf bsp/lib lib_bsp
          ln -sf bsp/modules modules_bsp
          
          cp ../target_kernel_config.txt .config
          make ARCH=riscv CROSS_COMPILE=$TC_PREFIX BSP_TOP="bsp/" olddefconfig
          make ARCH=riscv CROSS_COMPILE=$TC_PREFIX BSP_TOP="bsp/" prepare
          make ARCH=riscv CROSS_COMPILE=$TC_PREFIX BSP_TOP="bsp/" modules_prepare
          
          echo "Building ALSA sound modules..."
          make ARCH=riscv CROSS_COMPILE=$TC_PREFIX BSP_TOP="bsp/" -j$(nproc) M=sound modules || true
          make ARCH=riscv CROSS_COMPILE=$TC_PREFIX BSP_TOP="bsp/" -j$(nproc) M=sound/core modules || true
          make ARCH=riscv CROSS_COMPILE=$TC_PREFIX BSP_TOP="bsp/" -j$(nproc) M=sound/usb modules || true
          
          echo "Building SCSI and USB storage modules..."
          make ARCH=riscv CROSS_COMPILE=$TC_PREFIX BSP_TOP="bsp/" -j$(nproc) M=drivers/scsi modules || true
          make ARCH=riscv CROSS_COMPILE=$TC_PREFIX BSP_TOP="bsp/" -j$(nproc) M=drivers/usb/storage modules || true
          
          echo "Preparing v821_compat sources..."
          cp drivers/scsi/scsi_common.c "$GITHUB_WORKSPACE/v821_compat/scsi_common_impl.c"
          sed -e 's/module_init(.*);//' -e 's/module_exit(.*);//' lib/sg_pool.c > "$GITHUB_WORKSPACE/v821_compat/sg_pool_impl.c"
          sed -e 's/subsys_initcall(.*);//' -e 's/static int __init blk_scsi_ioctl_init/static int __maybe_unused blk_scsi_ioctl_init/' block/scsi_ioctl.c > "$GITHUB_WORKSPACE/v821_compat/scsi_ioctl_impl.c"
          
          echo "Building v821_compat module..."
          make ARCH=riscv CROSS_COMPILE=$TC_PREFIX BSP_TOP="bsp/" -C "$PWD" M="$GITHUB_WORKSPACE/v821_compat" modules
          
          mkdir -p ../modules
          find sound drivers/scsi drivers/usb/storage "$GITHUB_WORKSPACE/v821_compat" -name "*.ko" -exec cp {} ../modules/ \;
          
          echo "Patching vermagic to match stock 5.4.220..."
          python3 -c "
          import os
          d = '../modules'
          for f in os.listdir(d):
              if f.endswith('.ko'):
                  p = os.path.join(d, f)
                  data = open(p, 'rb').read()
                  old = b'vermagic=5.4.220+ preempt mod_unload riscv'
                  new = b'vermagic=5.4.220 preempt mod_unload riscv\x00'
                  if old in data:
                      open(p, 'wb').write(data.replace(old, new))
                      print('Patched:', f)
          "

      - name: Build v821_dap Standalone Player
        run: |
          TC_PREFIX=$(ls /opt/v821-toolchain/bin/*-gcc | head -n1 | sed 's/gcc$//')
          echo "Cloning official tinyalsa..."
          git clone --depth 1 https://github.com/tinyalsa/tinyalsa.git tinyalsa_repo
          echo "Compiling v821_dap (static musl)..."
          rm -rf "$GITHUB_WORKSPACE/dap_player/tinyalsa"
          ${TC_PREFIX}gcc -O2 -static \
            -I"$GITHUB_WORKSPACE/tinyalsa_repo/include" \
            -I"$GITHUB_WORKSPACE/dap_player" \
            "$GITHUB_WORKSPACE/dap_player/dap_player.c" \
            "$GITHUB_WORKSPACE/tinyalsa_repo/src/pcm.c" \
            "$GITHUB_WORKSPACE/tinyalsa_repo/src/pcm_hw.c" \
            "$GITHUB_WORKSPACE/tinyalsa_repo/src/snd_card_plugin.c" \
            -o modules/v821_dap -lpthread -lm
          ${TC_PREFIX}strip modules/v821_dap
          echo "=== COMPILED ARTIFACTS ==="
          ls -lh modules/

      - name: Upload compiled kernel modules and player
        uses: actions/upload-artifact@v4
        with:
          name: v821-audio-dap-bundle
          path: |
            modules/*.ko
            modules/v821_dap
